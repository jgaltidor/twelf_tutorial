name: Check proofs

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Build the pinned Twelf image
        run: docker build --platform linux/amd64 -t twelf-tutorial .
      - name: Check all proofs with Twelf
        run: docker run --rm --platform linux/amd64 -v "$PWD":/workdir twelf-tutorial
